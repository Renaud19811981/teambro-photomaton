<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>#TEAMBRO PHOTOMATON</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Unbounded:wght@500;800;900&family=DM+Sans:opsz,wght@9..40,400;9..40,600;9..40,700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#FFF1E2; --surface:#FFFFFF; --line:#F0D9C2; --text:#1A1433; --muted:#7B6E8A;
  --cabin:#15112E; --cabin-2:#221C4A; --bulb:#FFD66B; --pink:#FF4D8D; --pink-ink:#FFFFFF;
  --display:"Unbounded", "Arial Black", system-ui, sans-serif;
  --sans:"DM Sans", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  color-scheme:light;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){ --bg:#0C0A1C; --surface:#1B1640; --line:#2E2760; --text:#FFF4E8; --muted:#A79FC4; color-scheme:dark; }
}
:root[data-theme="dark"]{ --bg:#0C0A1C; --surface:#1B1640; --line:#2E2760; --text:#FFF4E8; --muted:#A79FC4; color-scheme:dark; }
*,*::before,*::after{box-sizing:inherit}
[hidden]{display:none !important}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--text);font-family:var(--sans);font-size:16px;line-height:1.45;-webkit-tap-highlight-color:transparent;overflow:hidden}
button,input{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none;padding:0}
:focus-visible{outline:3px solid var(--pink);outline-offset:3px}

.app{height:100%;max-width:560px;margin:0 auto;display:grid;grid-template-rows:auto 1fr auto auto;padding:0 14px}
header{display:flex;align-items:center;justify-content:space-between;padding:12px 4px 10px}
.logo{font-family:var(--display);font-weight:900;font-size:1.35rem;letter-spacing:-.02em;line-height:1;display:flex;align-items:center;gap:10px}
.logo span{display:flex;flex-direction:column;gap:3px}
.logo em{font-style:normal;font-size:.62em;color:var(--pink);letter-spacing:.04em}
.mini{position:absolute;right:12px;bottom:12px;width:62px;padding:5px;display:flex;flex-direction:column;gap:5px;background:#fff;transform:rotate(3deg);box-shadow:0 14px 24px -8px rgba(0,0,0,.7);z-index:3}
.mini i{display:block;aspect-ratio:4/3;background:rgba(21,17,46,.1);overflow:hidden}
.mini i.next{box-shadow:inset 0 0 0 2px var(--pink)}
.mini img{width:100%;height:100%;object-fit:cover;display:block;animation:drop .4s ease-out}
@keyframes drop{from{transform:scale(1.6);opacity:0}}
.logo i{width:14px;height:14px;border-radius:50%;background:var(--pink);box-shadow:0 0 0 4px color-mix(in srgb,var(--pink) 25%,transparent)}
.iconbtn{width:46px;height:46px;border-radius:50%;display:grid;place-items:center;background:var(--surface);border:1px solid var(--line)}
.iconbtn svg{width:22px;height:22px}

/* ---------- Cabin with marquee bulbs ---------- */
.cabin{position:relative;min-height:0;border-radius:28px;background:var(--cabin);padding:22px;overflow:hidden;
  box-shadow:inset 0 0 0 2px #2D2660, 0 24px 50px -20px rgba(21,17,46,.6)}
.bulbs{position:absolute;inset:0;pointer-events:none}
.bulb{position:absolute;width:9px;height:9px;margin:-4.5px 0 0 -4.5px;border-radius:50%;background:#5A4E2C;transition:background .15s, box-shadow .15s}
.bulb.on{background:var(--bulb);box-shadow:0 0 6px 2px rgba(255,214,107,.75),0 0 16px 4px rgba(255,214,107,.3)}
.screen{position:relative;width:100%;height:100%;border-radius:14px;overflow:hidden;
  background:radial-gradient(120% 80% at 50% 0%, var(--cabin-2) 0%, #0B0920 70%);display:flex;align-items:center;justify-content:center}
.screen video{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.screen video.mirror{transform:scaleX(-1)}

.count{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;pointer-events:none;
  font-family:var(--display);font-weight:900;font-size:min(50vw,280px);color:var(--bulb);line-height:1;opacity:0;
  text-shadow:0 0 40px rgba(255,214,107,.55),0 8px 0 #B5372E}
.count.word{font-size:min(15vw,84px);color:#fff;text-shadow:0 0 30px rgba(255,77,141,.8),0 5px 0 var(--pink)}
.count.show{opacity:1;animation:pop .9s cubic-bezier(.2,.9,.3,1.3)}
@keyframes pop{0%{transform:scale(.4) rotate(-8deg);opacity:0}30%{transform:scale(1.08) rotate(2deg);opacity:1}100%{transform:scale(1) rotate(0);opacity:1}}
.pill{position:absolute;left:50%;top:12px;transform:translateX(-50%);background:rgba(11,9,32,.7);color:#FFF4E8;border-radius:999px;padding:7px 14px;
  font-size:.85rem;font-weight:700;white-space:nowrap;backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px)}
.flash{position:fixed;inset:0;background:#fff;opacity:0;pointer-events:none;z-index:50}
.flash.go{animation:flash .5s ease-out}
@keyframes flash{0%{opacity:1}100%{opacity:0}}

/* Strip preview (tap-to-shoot mode) */
.strip{position:relative;transform:rotate(-1.5deg);box-shadow:0 30px 50px -18px rgba(0,0,0,.8),0 2px 0 rgba(0,0,0,.25)}
.slot{position:absolute;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;overflow:hidden}
.slot img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.slot .n{font-family:var(--display);font-weight:800;line-height:1;opacity:.35}
.slot .t{font-weight:700;font-size:.72rem;opacity:0}
.slot.next{box-shadow:inset 0 0 0 3px var(--pink);animation:ring 1.6s ease-in-out infinite}
.slot.next .n{opacity:1;color:var(--pink)}
.slot.next .t{opacity:1;color:var(--pink)}
@keyframes ring{50%{box-shadow:inset 0 0 0 6px var(--pink)}}
.cap{position:absolute;left:0;right:0;text-align:center;font-family:var(--display);font-weight:800;line-height:1.05;padding:0 6%;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;letter-spacing:-.01em}
.cap small{display:block;font-family:var(--sans);font-weight:600;font-size:.5em;opacity:.6;margin-top:.35em;letter-spacing:0}

.note{position:absolute;left:12px;right:12px;bottom:12px;background:rgba(11,9,32,.72);color:#E9E3FF;border-radius:14px;padding:10px 12px;font-size:.8rem;line-height:1.35;
  display:flex;gap:10px;align-items:center;backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px)}
.note span{flex:1}
.note button{flex:none;background:#FFF4E8;color:#15112E;border-radius:999px;padding:7px 12px;font-weight:700;font-size:.8rem}

/* Chips */
.chips{display:flex;gap:8px;overflow-x:auto;padding:14px 2px 2px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;border-radius:999px;padding:9px 15px;font-size:.88rem;font-weight:700;background:var(--surface);border:1px solid var(--line);white-space:nowrap}
.chip:first-child{background:var(--text);color:var(--bg);border-color:var(--text)}

/* Dock */
.dock{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;padding:12px 6px 16px}
.thumb{justify-self:start;width:54px;height:54px;border-radius:14px;overflow:hidden;background:var(--surface);border:1px solid var(--line);display:grid;place-items:center;color:var(--muted)}
.thumb img{width:100%;height:100%;object-fit:cover}
.thumb svg{width:22px;height:22px}
.shutter{width:88px;height:88px;border-radius:50%;background:var(--bulb);display:grid;place-items:center;box-shadow:0 0 0 6px color-mix(in srgb,var(--bulb) 30%,transparent),0 10px 24px -6px rgba(255,77,141,.6)}
.shutter span{width:64px;height:64px;border-radius:50%;background:var(--pink);box-shadow:inset 0 -5px 0 rgba(0,0,0,.18);transition:transform .15s, border-radius .2s, width .2s, height .2s}
.shutter:active span{transform:scale(.9)}
.shutter.stop span{width:32px;height:32px;border-radius:8px}
.flip{justify-self:end;width:54px;height:54px;border-radius:50%;background:var(--surface);border:1px solid var(--line);display:grid;place-items:center}
.flip svg{width:22px;height:22px}

/* Settings sheet */
.sheet{position:fixed;inset:0;z-index:40;display:flex;align-items:flex-end;justify-content:center;background:rgba(10,8,28,.6)}
.panel{width:100%;max-width:560px;max-height:88%;overflow-y:auto;background:var(--bg);border-radius:28px 28px 0 0;
  padding:10px 20px calc(22px + env(safe-area-inset-bottom,0px));animation:up .28s cubic-bezier(.2,.9,.3,1)}
@keyframes up{from{transform:translateY(40px);opacity:.4}}
.grab{width:42px;height:5px;border-radius:3px;background:var(--line);margin:0 auto 14px}
.panel h2{font-family:var(--display);font-weight:800;font-size:1.3rem;margin:0 0 18px;letter-spacing:-.01em}
.field{margin-bottom:20px}
.lbl{display:block;font-size:.85rem;color:var(--muted);margin-bottom:8px;font-weight:700}
.seg{display:flex;flex-wrap:wrap;gap:7px}
.seg button{border:1.5px solid var(--line);background:var(--surface);border-radius:999px;padding:9px 16px;min-height:44px;font-weight:700;font-size:.92rem}
.seg button[aria-pressed="true"]{background:var(--pink);color:var(--pink-ink);border-color:var(--pink)}
.layouts{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.layouts button{border:1.5px solid var(--line);background:var(--surface);border-radius:16px;padding:12px 6px 10px;display:flex;flex-direction:column;align-items:center;gap:8px;font-weight:700;font-size:.85rem}
.layouts button[aria-pressed="true"]{border-color:var(--pink);box-shadow:inset 0 0 0 1.5px var(--pink)}
.layouts svg{height:46px;width:auto}
.swatches{display:flex;gap:12px;flex-wrap:wrap}
.swatches button{width:42px;height:42px;border-radius:12px;box-shadow:inset 0 0 0 1px rgba(0,0,0,.18);transform:rotate(-4deg)}
.swatches button[aria-pressed="true"]{outline:3px solid var(--pink);outline-offset:3px;transform:rotate(0)}
input[type=text]{width:100%;padding:14px 16px;border-radius:16px;border:1.5px solid var(--line);background:var(--surface);font-weight:600}
.done{width:100%;min-height:56px;border-radius:18px;background:var(--text);color:var(--bg);font-family:var(--display);font-weight:800;font-size:1rem;margin-top:4px}

/* Print reveal */
.reveal{position:fixed;inset:0;z-index:45;background:var(--cabin);display:flex;flex-direction:column;align-items:center;
  padding:calc(16px + env(safe-area-inset-top,0px)) 18px calc(18px + env(safe-area-inset-bottom,0px))}
.reveal .top{width:100%;max-width:520px;display:flex;justify-content:space-between;align-items:center;color:#FFF4E8;margin-bottom:12px}
.reveal .top b{font-family:var(--display);font-weight:800;font-size:1.05rem}
.reveal .x{width:44px;height:44px;border-radius:50%;background:rgba(255,255,255,.1);display:grid;place-items:center;color:#FFF4E8}
.slotbar{width:72%;max-width:340px;height:12px;border-radius:6px;background:#06050F;box-shadow:inset 0 2px 4px #000, 0 1px 0 #2D2660;position:relative;z-index:2}
.out{flex:1;min-height:0;width:100%;display:flex;justify-content:center;overflow:hidden;margin-top:-6px}
.out img{max-width:66%;max-height:100%;object-fit:contain;align-self:flex-start;box-shadow:0 30px 50px -16px rgba(0,0,0,.8);transform-origin:top center}
.out img.print{animation:print 2.2s cubic-bezier(.4,0,.2,1) both}
@keyframes print{0%{transform:translateY(-100%);filter:brightness(1.6) saturate(0)}70%{transform:translateY(0);filter:brightness(1.25) saturate(.3)}100%{transform:translateY(0);filter:none}}
.actions{width:100%;max-width:520px;display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:16px}
.actions button{min-height:56px;border-radius:18px;font-weight:700;font-size:1rem;background:rgba(255,255,255,.1);color:#FFF4E8}
.actions .primary{background:var(--pink);color:#fff}
.actions .print{grid-column:1/-1;display:flex;align-items:center;justify-content:center;gap:10px}
.actions .print svg{width:22px;height:22px}
#printArea{display:none}
@media print{
  @page{size:4in 6in;margin:0}
  :root{padding:0}
  html,body{height:auto;overflow:visible;background:#fff}
  body>*:not(#printArea){display:none !important}
  #printArea{display:block !important}
  #printArea img{width:100%;height:auto;display:block}
}
.film{display:flex;gap:8px;overflow-x:auto;width:100%;max-width:520px;margin-top:12px}
.film button{flex:none;width:48px;height:48px;border-radius:10px;overflow:hidden;opacity:.5}
.film button[aria-current="true"]{opacity:1;outline:2px solid var(--bulb);outline-offset:2px}
.film img{width:100%;height:100%;object-fit:cover}

.toast{position:fixed;left:50%;top:calc(16px + env(safe-area-inset-top,0px));transform:translateX(-50%);background:var(--text);color:var(--bg);padding:11px 16px;border-radius:14px;font-size:.9rem;font-weight:700;opacity:0;transition:opacity .2s;z-index:60;max-width:90vw;text-align:center}
.toast.on{opacity:1}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
@media (prefers-reduced-motion: reduce){.count.show,.flash.go,.panel,.out img.print,.slot.next{animation:none}}
</style>
</head>
<body>
<div class="flash" id="flash"></div>
<div class="toast" id="toast" role="status" aria-live="polite"></div>

<main class="app">
  <header>
    <div class="logo"><i></i><span><em>#TEAMBRO</em>PHOTOMATON</span></div>
    <button class="iconbtn" id="setBtn" aria-label="Programmer la séance">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 7h9M18 7h2M4 17h4M13 17h7"/><circle cx="15.5" cy="7" r="2.3"/><circle cx="10.5" cy="17" r="2.3"/></svg>
    </button>
  </header>

  <section class="cabin" id="cabin">
    <div class="bulbs" id="bulbs" aria-hidden="true"></div>
    <div class="screen" id="screen">
      <video id="video" playsinline muted autoplay class="mirror" hidden poster="data:image/gif;base64,R0lGODlhAQABAIAAAAAAAP///yH5BAEAAAAALAAAAAABAAEAAAIBRAA7"></video>
      <div class="strip" id="strip" hidden></div>
      <div class="mini" id="mini" hidden aria-hidden="true"></div>
      <div class="pill" id="pill" hidden></div>
      <div class="count" id="count" aria-live="assertive"></div>
      <div class="note" id="note" hidden><span>Touchez une case pour prendre chaque photo avec l’appareil du téléphone.</span><button type="button" id="libBtn">Galerie</button></div>
    </div>
  </section>

  <div class="chips" id="chips"></div>

  <div class="dock">
    <button class="thumb" id="thumb" aria-label="Voir mes bandes">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="7" y="2.5" width="10" height="19" rx="1.5"/><path d="M9 6.5h6M9 11.5h6M9 16.5h6"/></svg>
    </button>
    <button class="shutter" id="shutter" aria-label="Lancer la séance"><span></span></button>
    <button class="flip" id="flip" aria-label="Changer de caméra">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 11a8 8 0 0 0-14.3-4.9L4 8"/><path d="M4 4v4h4"/><path d="M4 13a8 8 0 0 0 14.3 4.9L20 16"/><path d="M20 20v-4h-4"/></svg>
    </button>
  </div>
</main>

<div class="sheet" id="sheet" hidden>
  <div class="panel" role="dialog" aria-modal="true" aria-labelledby="sheetTitle">
    <div class="grab"></div>
    <h2 id="sheetTitle">Programmer la séance</h2>
    <div class="field"><span class="lbl">Format</span><div class="layouts" id="layouts"></div></div>
    <div class="field"><span class="lbl">Nombre de photos</span><div class="seg" data-key="shots"></div></div>
    <div class="field"><span class="lbl">Démarrage différé</span><div class="seg" data-key="startDelay"></div></div>
    <div class="field"><span class="lbl">Compte à rebours entre les photos</span><div class="seg" data-key="countdown"></div></div>
    <div class="field"><span class="lbl">Filtre</span><div class="seg" data-key="filter"></div></div>
    <div class="field"><span class="lbl">Papier</span><div class="swatches" id="swatches"></div></div>
    <div class="field"><label class="lbl" for="caption">Texte en bas de la bande</label><input type="text" id="caption" maxlength="28" placeholder="Ex. Mariage de Léa & Sam"></div>
    <div class="field"><span class="lbl">Son et flash</span><div class="seg" data-key="fx"></div></div>
    <button class="done" id="doneBtn">C’est parti</button>
  </div>
</div>

<div class="reveal" id="reveal" hidden role="dialog" aria-modal="true" aria-label="Votre bande">
  <div class="top"><b>Votre bande</b><button class="x" id="closeReveal" aria-label="Fermer">
    <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg></button></div>
  <div class="slotbar"></div>
  <div class="out"><img id="bigImg" alt=""></div>
  <div class="actions">
    <button class="primary print" id="printBtn"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><path d="M7 9V3h10v6"/><rect x="3" y="9" width="18" height="8" rx="2"/><path d="M7 14h10v7H7z"/></svg>Imprimer</button>
    <button id="saveBtn">Enregistrer</button>
    <button id="shareBtn">Partager</button>
  </div>
  <div class="film" id="film"></div>
</div>

<div id="printArea"><img id="printImg" alt=""></div>
<input type="file" accept="image/*" capture="user" id="camIn" class="sr" tabindex="-1">
<input type="file" accept="image/*" id="libIn" class="sr" tabindex="-1" multiple>

<script>
(() => {
  const $ = id => document.getElementById(id);
  const OPTIONS = {
    startDelay: [[0,"Aucun"],[10,"10 s"],[30,"30 s"],[60,"1 min"]],
    shots: [[1,"1"],[2,"2"],[3,"3"],[4,"4"],[6,"6"]],
    countdown: [[3,"3 s"],[5,"5 s"],[10,"10 s"]],
    filter: [["none","Couleur"],["bw","Noir & blanc"],["sepia","Sépia"],["warm","Chaud"]],
    fx: [["on","Activés"],["off","Silencieux"]]
  };
  const LAYOUTS = [
    ["strip","Bande",'<svg viewBox="0 0 20 46"><rect x="1" y="1" width="18" height="44" rx="1.5" fill="none" stroke="currentColor" stroke-width="1.5"/><rect x="4" y="4" width="12" height="8" fill="currentColor" opacity=".5"/><rect x="4" y="14" width="12" height="8" fill="currentColor" opacity=".5"/><rect x="4" y="24" width="12" height="8" fill="currentColor" opacity=".5"/></svg>'],
    ["grid","Grille",'<svg viewBox="0 0 34 46"><rect x="1" y="1" width="32" height="44" rx="1.5" fill="none" stroke="currentColor" stroke-width="1.5"/><rect x="4" y="4" width="12" height="12" fill="currentColor" opacity=".5"/><rect x="18" y="4" width="12" height="12" fill="currentColor" opacity=".5"/><rect x="4" y="18" width="12" height="12" fill="currentColor" opacity=".5"/><rect x="18" y="18" width="12" height="12" fill="currentColor" opacity=".5"/></svg>'],
    ["single","Grand",'<svg viewBox="0 0 34 46"><rect x="1" y="1" width="32" height="44" rx="1.5" fill="none" stroke="currentColor" stroke-width="1.5"/><rect x="4" y="4" width="26" height="30" fill="currentColor" opacity=".5"/></svg>']
  ];
  const PAPERS = [["#FFFFFF","Blanc"],["#F6E7CF","Crème"],["#FF4D8D","Rose bonbon"],["#FFD66B","Jaune"],["#15112E","Nuit"],["#111111","Noir"]];
  const DARK_PAPERS = ["#15112E","#111111","#FF4D8D"];
  const FILTERS = { none:"none", bw:"grayscale(1) contrast(1.2)", sepia:"sepia(.85) contrast(1.05)", warm:"saturate(1.3) sepia(.18) brightness(1.04)" };

  let S = { startDelay:0, shots:4, countdown:3, layout:"strip", filter:"none", fx:"on", paper:"#FFFFFF", caption:"" };
  try { const s = JSON.parse(localStorage.getItem("pb3")||"null"); if (s) S = {...S, ...s}; } catch(e){}
  const persist = () => { try { localStorage.setItem("pb3", JSON.stringify(S)); } catch(e){} };

  function geo(n){
    const pad=40, footer = S.caption.trim() ? 160 : 80;
    let cols, cw, ch;
    if (S.layout==="single" || n===1){ cols=1; cw=1200; ch=900; }
    else if (S.layout==="grid"){ cols=2; cw=700; ch=700; }
    else { cols=1; cw=600; ch=450; }
    const rows=Math.ceil(n/cols);
    const W=cols*cw+(cols+1)*pad, H=rows*ch+(rows+1)*pad+footer;
    const slots=[...Array(n)].map((_,i)=>({x:pad+(i%cols)*(cw+pad), y:pad+Math.floor(i/cols)*(ch+pad), w:cw, h:ch}));
    return {W,H,pad,footer,slots};
  }

  /* ---------- Marquee bulbs ---------- */
  let bulbs=[], bulbMode="idle", tick=0;
  function placeBulbs(){
    const c=$("cabin"), w=c.clientWidth, h=c.clientHeight, m=11, gap=26, box=$("bulbs");
    box.innerHTML=""; bulbs=[];
    const pts=[];
    const nx=Math.max(2,Math.round((w-2*m)/gap)), ny=Math.max(2,Math.round((h-2*m)/gap));
    for(let i=0;i<nx;i++) pts.push([m+i*(w-2*m)/nx, m]);
    for(let i=0;i<ny;i++) pts.push([w-m, m+i*(h-2*m)/ny]);
    for(let i=0;i<nx;i++) pts.push([w-m-i*(w-2*m)/nx, h-m]);
    for(let i=0;i<ny;i++) pts.push([m, h-m-i*(h-2*m)/ny]);
    pts.forEach(([x,y])=>{ const b=document.createElement("i"); b.className="bulb"; b.style.left=x+"px"; b.style.top=y+"px"; box.appendChild(b); bulbs.push(b); });
    paintBulbs();
  }
  const reduced = matchMedia("(prefers-reduced-motion: reduce)").matches;
  function paintBulbs(){
    const n=bulbs.length;
    bulbs.forEach((b,i)=>{
      let on;
      if (bulbMode==="all") on=true;
      else if (bulbMode==="chase") on = reduced ? true : ((i+tick)%4===0 || (i+tick)%4===1);
      else on = reduced ? i%2===0 : (i+Math.floor(tick/3))%2===0;
      b.classList.toggle("on",on);
    });
  }
  setInterval(()=>{ tick++; if(bulbMode==="chase" || tick%3===0) paintBulbs(); }, 140);
  const setBulbs = m => { bulbMode=m; paintBulbs(); };

  /* ---------- Settings UI ---------- */
  document.querySelectorAll(".seg").forEach(seg => {
    const key=seg.dataset.key;
    OPTIONS[key].forEach(([v,label]) => {
      const b=document.createElement("button"); b.type="button"; b.textContent=label;
      b.setAttribute("aria-pressed", String(S[key]===v));
      b.onclick=()=>{ S[key]=v; seg.querySelectorAll("button").forEach(x=>x.setAttribute("aria-pressed","false")); b.setAttribute("aria-pressed","true"); persist(); onSettings(); };
      seg.appendChild(b);
    });
  });
  LAYOUTS.forEach(([v,label,svg])=>{
    const b=document.createElement("button"); b.type="button"; b.innerHTML=svg+`<span>${label}</span>`;
    b.setAttribute("aria-pressed",String(S.layout===v));
    b.onclick=()=>{ S.layout=v; $("layouts").querySelectorAll("button").forEach(x=>x.setAttribute("aria-pressed","false")); b.setAttribute("aria-pressed","true"); persist(); onSettings(); };
    $("layouts").appendChild(b);
  });
  PAPERS.forEach(([c,name]) => {
    const b=document.createElement("button"); b.type="button"; b.style.background=c; b.setAttribute("aria-label",name);
    b.setAttribute("aria-pressed", String(S.paper===c));
    b.onclick=()=>{ S.paper=c; $("swatches").querySelectorAll("button").forEach(x=>x.setAttribute("aria-pressed","false")); b.setAttribute("aria-pressed","true"); persist(); onSettings(); };
    $("swatches").appendChild(b);
  });
  $("caption").value=S.caption;
  $("caption").oninput=e=>{ S.caption=e.target.value; persist(); onSettings(); };
  const openSheet=()=>{ $("sheet").hidden=false; };
  $("setBtn").onclick=openSheet;
  $("doneBtn").onclick=()=>{ $("sheet").hidden=true; };
  $("sheet").onclick=e=>{ if(e.target.id==="sheet") $("sheet").hidden=true; };

  const label=k=>OPTIONS[k].find(o=>o[0]===S[k])[1];
  function renderChips(){
    const lay=LAYOUTS.find(l=>l[0]===S.layout)[1];
    const items=[`${S.shots} photo${S.shots>1?"s":""}`, lay, `Décompte ${label("countdown")}`,
      S.startDelay?`Départ ${label("startDelay")}`:null, S.filter!=="none"?label("filter"):null].filter(Boolean);
    $("chips").innerHTML="";
    items.forEach(t=>{ const c=document.createElement("button"); c.className="chip"; c.textContent=t; c.onclick=openSheet; $("chips").appendChild(c); });
  }
  function onSettings(){
    renderChips(); $("video").style.filter=FILTERS[S.filter];
    if(!camMode){ if(pending.length>S.shots) pending.length=S.shots; renderStrip(); }
  }

  /* ---------- Strip preview ---------- */
  let pending=[], target=0;
  function renderStrip(){
    const n=S.shots, g=geo(n), sc=$("screen"), el=$("strip");
    const noteH = $("note").hidden ? 0 : 64;
    const avW=sc.clientWidth-40, avH=sc.clientHeight-40-noteH;
    const k=Math.max(.05,Math.min(avW/g.W, avH/g.H));
    el.style.width=(g.W*k)+"px"; el.style.height=(g.H*k)+"px"; el.style.background=S.paper;
    el.style.marginBottom=noteH+"px";
    const dark=DARK_PAPERS.includes(S.paper), ink = dark ? "#FFF4E8" : "#15112E";
    el.innerHTML="";
    g.slots.forEach((s,i)=>{
      const d=document.createElement("button"); d.className="slot"; d.type="button";
      Object.assign(d.style,{left:s.x*k+"px",top:s.y*k+"px",width:s.w*k+"px",height:s.h*k+"px",
        background: dark ? "rgba(255,255,255,.12)" : "rgba(21,17,46,.08)", color:ink});
      if(pending[i]){ const im=new Image(); im.src=pending[i].toDataURL("image/jpeg",.7); im.style.filter=FILTERS[S.filter]; im.alt=""; d.appendChild(im); d.setAttribute("aria-label",`Reprendre la photo ${i+1}`); }
      else {
        const nEl=document.createElement("span"); nEl.className="n"; nEl.textContent=i+1; nEl.style.fontSize=Math.max(14,Math.min(s.w,s.h)*k*.32)+"px";
        const tEl=document.createElement("span"); tEl.className="t"; tEl.textContent="Toucher";
        d.append(nEl,tEl);
        if(i===pending.length) d.classList.add("next");
        d.setAttribute("aria-label",`Prendre la photo ${i+1}`);
      }
      d.onclick=()=>{ target=pending[i]?i:pending.length; $("camIn").click(); };
      el.appendChild(d);
    });
    const cap=document.createElement("div"); cap.className="cap"; cap.style.color=ink;
    const date=new Date().toLocaleDateString("fr-FR",{day:"numeric",month:"long",year:"numeric"});
    if(S.caption.trim()){ cap.style.fontSize=Math.max(9,48*k)+"px"; cap.textContent=S.caption.trim(); const sm=document.createElement("small"); sm.textContent=date; cap.appendChild(sm); }
    else { cap.style.fontSize=Math.max(8,26*k)+"px"; cap.style.fontFamily="var(--sans)"; cap.style.fontWeight="600"; cap.style.opacity=".55"; cap.textContent=date; }
    cap.style.top=(g.H-g.footer+g.pad*.45)*k+"px";
    el.appendChild(cap);
  }
  async function fileToCanvas(f){
    const img=await new Promise((res,rej)=>{ const i=new Image(); i.onload=()=>res(i); i.onerror=rej; i.src=URL.createObjectURL(f); });
    const r=Math.min(1,1600/Math.max(img.naturalWidth,img.naturalHeight));
    const cv=document.createElement("canvas"); cv.width=img.naturalWidth*r; cv.height=img.naturalHeight*r;
    cv.getContext("2d").drawImage(img,0,0,cv.width,cv.height); URL.revokeObjectURL(img.src); return cv;
  }
  $("camIn").onchange=async e=>{ const f=e.target.files[0]; e.target.value=""; if(!f) return;
    doFlash(); pending[target]=await fileToCanvas(f); renderStrip(); await maybeFinish(); };
  $("libBtn").onclick=()=>$("libIn").click();
  $("libIn").onchange=async e=>{ const fs=[...e.target.files]; e.target.value="";
    for(const f of fs){ if(pending.length>=S.shots) break; pending.push(await fileToCanvas(f)); }
    renderStrip(); await maybeFinish(); };
  async function maybeFinish(){
    if(pending.filter(Boolean).length===S.shots){ setBulbs("all"); await compose(pending.slice(0,S.shots)); pending=[]; renderStrip(); setBulbs("idle"); }
  }

  /* ---------- Camera ---------- */
  const video=$("video");
  let stream=null, facing="user", camMode=false;
  async function startCam(){
    if(stream) stream.getTracks().forEach(t=>t.stop());
    try{
      if(!navigator.mediaDevices?.getUserMedia) throw new Error("no gum");
      stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:facing,width:{ideal:1920},height:{ideal:1440}},audio:false});
      video.srcObject=stream; await video.play();
      camMode=true; video.classList.toggle("mirror",facing==="user");
      video.hidden=false; $("strip").hidden=true; $("note").hidden=true;
    }catch(err){
      camMode=false; video.hidden=true; $("strip").hidden=false; $("note").hidden=false;
      requestAnimationFrame(renderStrip);
    }
  }
  $("flip").onclick=()=>{ facing=facing==="user"?"environment":"user"; $("camIn").setAttribute("capture",facing);
    if(camMode) startCam(); else toast(facing==="user"?"Caméra avant":"Caméra arrière"); };

  let actx=null;
  function beep(freq=880,dur=.12){
    if(S.fx!=="on") return;
    try{ actx=actx||new (window.AudioContext||window.webkitAudioContext)();
      const o=actx.createOscillator(),g=actx.createGain(); o.type="triangle"; o.frequency.value=freq; o.connect(g); g.connect(actx.destination);
      g.gain.setValueAtTime(.25,actx.currentTime); g.gain.exponentialRampToValueAtTime(.001,actx.currentTime+dur); o.start(); o.stop(actx.currentTime+dur);
    }catch(e){}
  }
  const sleep=ms=>new Promise(r=>setTimeout(r,ms));
  let aborted=false, running=false, wakeLock=null;
  function showCount(t,word){ const c=$("count"); c.textContent=t; c.classList.toggle("word",!!word); c.classList.remove("show"); void c.offsetWidth; c.classList.add("show"); }
  async function countdown(sec,big){
    for(let i=sec;i>0;i--){
      if(aborted) return false;
      if(!big && i>5){ $("pill").textContent=`Départ dans ${i} s`; await sleep(1000); continue; }
      showCount(i); beep(i===1?1320:880); await sleep(1000);
    }
    return !aborted;
  }
  function grab(){
    const w=video.videoWidth,h=video.videoHeight,cv=document.createElement("canvas"); cv.width=w; cv.height=h;
    const x=cv.getContext("2d"); if(facing==="user"){x.translate(w,0);x.scale(-1,1);} x.drawImage(video,0,0,w,h); return cv;
  }
  function doFlash(){ if(S.fx!=="on") return; const f=$("flash"); f.classList.remove("go"); void f.offsetWidth; f.classList.add("go"); }

  async function runSession(){
    running=true; aborted=false; $("shutter").classList.add("stop"); $("shutter").setAttribute("aria-label","Arrêter la séance");
    try{ wakeLock=await navigator.wakeLock?.request("screen"); }catch(e){}
    const pill=$("pill"); pill.hidden=false; setBulbs("chase"); const shots=[];
    const mini=$("mini"); mini.innerHTML=""; mini.style.background=S.paper; mini.hidden=false;
    for(let j=0;j<S.shots;j++){ const c=document.createElement("i"); if(j===0) c.className="next"; mini.appendChild(c); }
    if(S.startDelay){ if(!(await countdown(S.startDelay,false))) return end(); }
    for(let i=0;i<S.shots;i++){
      pill.textContent=`Photo ${i+1} sur ${S.shots}`;
      if(!(await countdown(S.countdown,true))) return end();
      showCount("Souriez !",true); setBulbs("all"); doFlash(); beep(1760,.08); const shot=grab(); shots.push(shot);
      { const cells=$("mini").children, im=new Image(); im.src=shot.toDataURL("image/jpeg",.5); im.style.filter=FILTERS[S.filter]; im.alt="";
        cells[i].className=""; cells[i].appendChild(im); if(cells[i+1]) cells[i+1].className="next"; }
      await sleep(800); setBulbs("chase");
    }
    end(); await compose(shots);
  }
  function end(){
    running=false; $("shutter").classList.remove("stop"); $("shutter").setAttribute("aria-label","Lancer la séance");
    $("pill").hidden=true; $("mini").hidden=true; $("count").classList.remove("show"); setBulbs("idle");
    try{wakeLock?.release();}catch(e){} wakeLock=null;
  }
  $("shutter").onclick=()=>{
    if(running){ aborted=true; end(); toast("Séance arrêtée"); return; }
    if(camMode) runSession(); else { target=pending.length<S.shots?pending.length:0; $("camIn").click(); }
  };

  /* ---------- Compose print ---------- */
  function drawCover(ctx,src,x,y,w,h){ const r=Math.max(w/src.width,h/src.height),sw=w/r,sh=h/r; ctx.drawImage(src,(src.width-sw)/2,(src.height-sh)/2,sw,sh,x,y,w,h); }
  async function compose(shots){
    const g=geo(shots.length), cv=document.createElement("canvas"); cv.width=g.W; cv.height=g.H;
    const x=cv.getContext("2d"); x.fillStyle=S.paper; x.fillRect(0,0,g.W,g.H);
    x.filter=FILTERS[S.filter]; shots.forEach((s,i)=>{ const r=g.slots[i]; drawCover(x,s,r.x,r.y,r.w,r.h); }); x.filter="none";
    const dark=DARK_PAPERS.includes(S.paper); x.fillStyle=dark?"#FFF4E8":"#15112E"; x.textAlign="center"; x.textBaseline="top";
    const date=new Date().toLocaleDateString("fr-FR",{day:"numeric",month:"long",year:"numeric"});
    const top=g.H-g.footer+g.pad*.45, cap=S.caption.trim();
    try{ await document.fonts.load("800 48px Unbounded"); await document.fonts.load("600 26px 'DM Sans'"); }catch(e){}
    if(cap){
      x.font=`800 48px Unbounded, "Arial Black", sans-serif`; x.fillText(cap,g.W/2,top,g.W-80);
      x.globalAlpha=.6; x.font=`600 24px "DM Sans", sans-serif`; x.fillText(date,g.W/2,top+68); x.globalAlpha=1;
    } else { x.globalAlpha=.55; x.font=`600 26px "DM Sans", sans-serif`; x.fillText(date,g.W/2,top); x.globalAlpha=1; }
    const blob=await new Promise(r=>cv.toBlob(r,"image/jpeg",.92));
    addResult(blob);
  }

  /* ---------- Results ---------- */
  const results=[]; let current=0;
  const fname=d=>`teambro-photomaton-${d.toISOString().slice(0,19).replace(/[:T]/g,"-")}.jpg`;
  function addResult(blob){
    results.unshift({blob,url:URL.createObjectURL(blob),when:new Date()});
    $("thumb").innerHTML=`<img src="${results[0].url}" alt="">`;
    openReveal(0,true);
  }
  function openReveal(i,animate){
    if(!results.length){ toast("Aucune bande pour l’instant"); return; }
    current=i; const r=results[i], img=$("bigImg");
    img.classList.remove("print"); img.src=r.url; img.alt=`Bande du ${r.when.toLocaleString("fr-FR")}`;
    if(animate){ void img.offsetWidth; img.classList.add("print"); beep(220,.6); }
    const film=$("film"); film.innerHTML=""; film.hidden=results.length<2;
    results.forEach((x,j)=>{ const b=document.createElement("button"); b.setAttribute("aria-current",String(j===i)); b.setAttribute("aria-label",`Bande ${j+1}`);
      b.innerHTML=`<img src="${x.url}" alt="">`; b.onclick=()=>openReveal(j,false); film.appendChild(b); });
    $("reveal").hidden=false;
  }
  $("thumb").onclick=()=>openReveal(0,false);
  $("closeReveal").onclick=()=>{ $("reveal").hidden=true; };

  let downloads=null;
  (async()=>{ try{ downloads=await window.claude?.use?.("downloads"); }catch(e){} })();
  $("saveBtn").onclick=async()=>{
    const r=results[current]; if(!r) return;
    if(downloads){
      try{ await downloads.save({filename:fname(r.when),data:r.blob}); toast("Bande enregistrée"); }
      catch(e){ if(e?.code!=="declined") toast("Enregistrement impossible ici : appui long sur l’image"); }
      return;
    }
    const a=document.createElement("a"); a.href=r.url; a.download=fname(r.when); document.body.appendChild(a); a.click(); a.remove();
  };
  $("shareBtn").onclick=async()=>{
    const r=results[current]; if(!r) return;
    const file=new File([r.blob],fname(r.when),{type:"image/jpeg"});
    try{ if(navigator.canShare?.({files:[file]})){ await navigator.share({files:[file],title:"#TEAMBRO PHOTOMATON"}); return; } }catch(e){ if(e.name==="AbortError") return; }
    $("saveBtn").click();
  };

  /* ---------- Print: 10x15 sheet (two strips side by side, to cut) ---------- */
  async function printSheet(r){
    const img=await new Promise((res,rej)=>{ const i=new Image(); i.onload=()=>res(i); i.onerror=rej; i.src=r.url; });
    const ratio=img.width/img.height, land=ratio>1.05;
    const W=land?1800:1200, H=land?1200:1800, m=30;
    const cv=document.createElement("canvas"); cv.width=W; cv.height=H; const x=cv.getContext("2d");
    x.fillStyle="#fff"; x.fillRect(0,0,W,H);
    if(!land && ratio<0.6){
      const w=Math.min((W-3*m)/2,(H-2*m)*ratio), h=w/ratio, y=(H-h)/2;
      x.drawImage(img,W/2-m/2-w,y,w,h); x.drawImage(img,W/2+m/2,y,w,h);
      x.strokeStyle="#bbb"; x.lineWidth=2; x.setLineDash([14,12]); x.beginPath(); x.moveTo(W/2,0); x.lineTo(W/2,H); x.stroke();
    } else {
      const k=Math.min((W-2*m)/img.width,(H-2*m)/img.height), w=img.width*k, h=img.height*k;
      x.drawImage(img,(W-w)/2,(H-h)/2,w,h);
    }
    return new Promise(res=>cv.toBlob(res,"image/jpeg",.95));
  }
  $("printBtn").onclick=async()=>{
    const r=results[current]; if(!r) return;
    const blob=await printSheet(r);
    const file=new File([blob],fname(r.when).replace(".jpg","-impression.jpg"),{type:"image/jpeg"});
    try{
      if(navigator.canShare?.({files:[file]})){
        toast("Choisis l’appli de ton imprimante photo");
        await navigator.share({files:[file],title:"Imprimer"}); return;
      }
    }catch(e){ if(e.name==="AbortError") return; }
    const pi=$("printImg"); pi.src=URL.createObjectURL(blob);
    await new Promise(res=>{ if(pi.complete) res(); else pi.onload=res; });
    try{ window.print(); }catch(e){ toast("Impression impossible ici : enregistre la bande puis imprime‑la depuis ta galerie"); }
  };

  let tt; function toast(m){ const t=$("toast"); t.textContent=m; t.classList.add("on"); clearTimeout(tt); tt=setTimeout(()=>t.classList.remove("on"),3000); }

  window.addEventListener("resize",()=>{ placeBulbs(); if(!camMode) renderStrip(); });
  renderChips(); placeBulbs(); onSettings(); startCam();
  document.fonts?.ready?.then(()=>{ if(!camMode) renderStrip(); });
})();
</script>
</body>
</html>
